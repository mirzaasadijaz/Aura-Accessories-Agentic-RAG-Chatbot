<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }

        /* Custom scrollbar for chat area */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }

        /* Message pop-in animation */
        @keyframes slideUpFade {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-message {
            animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Typing indicator animation */
        @keyframes typing {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-3px); opacity: 1; }
        }
        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #64748b;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        /* Glassmorphism effects */
        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Main Chat Widget Container -->
    <div class="w-full max-w-3xl bg-gray-50 rounded-3xl shadow-2xl border border-gray-200 overflow-hidden flex flex-col h-[85vh] sm:h-[80vh] relative">
        
        <!-- Header -->
        <header class="glass-header border-b border-gray-200 p-4 sm:px-6 flex items-center justify-between z-10 absolute top-0 left-0 right-0">
            <div class="flex items-center gap-3 border-b-0">
                <div class="relative flex-shrink-0">
                    <!-- Bot Avatar -->
                    <div class="w-12 h-12 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-full flex items-center justify-center shadow-md">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <!-- Online Status Indicator -->
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
                </div>
                <div>
                    <h1 class="font-semibold text-gray-800 text-lg leading-tight">Agentic AI</h1>
                    <p class="text-xs text-gray-500 flex items-center gap-1">
                        <span class="inline-block w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                        Hybrid RAG Online
                    </p>
                </div>
            </div>
            
            <!-- Optional Header Actions (e.g., settings, clear chat) -->
            <button onclick="clearChat()" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors tooltip" title="Clear Chat">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </button>
        </header>

        <!-- Chat History Area -->
        <main id="chat-container" class="flex-1 overflow-y-auto chat-scroll p-4 sm:p-6 mt-[76px] mb-[76px] flex flex-col gap-5 bg-[#f8fafc]">
            
            <!-- Welcome Message -->
            <div class="flex w-full mt-4">
                <div class="flex max-w-[85%] sm:max-w-[75%]">
                    <div class="w-8 h-8 flex-shrink-0 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-full flex items-center justify-center mt-1 mr-2 hidden sm:flex">
                         <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <div class="bg-white border border-gray-100 shadow-sm text-gray-800 rounded-2xl rounded-tl-sm px-5 py-3.5 text-[15px] leading-relaxed">
                        <p>Hello! I am your Enterprise Agentic AI.</p>
                        <p class="mt-2 text-sm text-gray-500">I can search your local PDFs, internal documents, and scrape the live internet to answer your queries. How can I help you today?</p>
                    </div>
                </div>
            </div>

        </main>

        <!-- Input Area -->
        <footer class="bg-white border-t border-gray-200 p-3 sm:p-4 absolute bottom-0 left-0 right-0">
            <form id="chat-form" class="flex gap-2 items-end max-w-4xl mx-auto relative relative">
                <div class="flex-1 bg-gray-50 border border-gray-300 rounded-2xl focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500 transition-all flex items-center px-4 py-1 shadow-inner">
                    <textarea 
                        id="message-input" 
                        rows="1" 
                        class="w-full bg-transparent border-none focus:ring-0 resize-none py-2.5 text-gray-700 placeholder-gray-400 text-[15px] outline-none" 
                        placeholder="Ask anything..."
                        style="min-height: 44px; max-height: 120px;"
                    ></textarea>
                </div>
                
                <button type="submit" id="send-btn" class="flex-shrink-0 w-12 h-12 bg-blue-600 hover:bg-blue-700 text-white rounded-full flex items-center justify-center transition-all shadow-md active:scale-95 flex-col justify-center items-center">
                    <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19V5m0 0l-7 7m7-7l7 7"></path>
                    </svg>
                </button>
            </form>
            <div class="text-center mt-2">
                 <p class="text-[10px] text-gray-400 font-medium tracking-wide">POWERED BY LOCAL RAG & WEB SEARCH</p>
            </div>
        </footer>
    </div>

    <script>
        // ---------------------------------------------------------
        // NEW FEATURE: Unique Session ID for Multi-User & Incognito
        // ---------------------------------------------------------
        let sessionId = sessionStorage.getItem('chat_session_id');
        if (!sessionId) {
            // Generate a random ID like 'user_x7b9q2'
            sessionId = 'user_' + Math.random().toString(36).substr(2, 9);
            sessionStorage.setItem('chat_session_id', sessionId);
        }

        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatContainer = document.getElementById('chat-container');
        const sendBtn = document.getElementById('send-btn');
        let isWaitingForResponse = false;

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value.trim() === '') {
                this.style.height = '44px';
            }
        });

        // Handle Enter key (Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function appendMessage(role, text) {
            const msgWrapper = document.createElement('div');
            msgWrapper.className = `flex w-full animate-message ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            let innerHTML = '';
            
            if (role === 'user') {
                innerHTML = `
                    <div class="flex max-w-[85%] sm:max-w-[75%] flex-row-reverse">
                        <div class="bg-blue-600 text-white shadow-md rounded-2xl rounded-tr-sm px-5 py-3.5 text-[15px] leading-relaxed break-words">
                            ${escapeHTML(text)}
                        </div>
                    </div>
                `;
            } else if (role === 'bot') {
                innerHTML = `
                    <div class="flex max-w-[85%] sm:max-w-[75%]">
                        <div class="w-8 h-8 flex-shrink-0 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-full flex items-center justify-center mt-1 mr-2 hidden sm:flex">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <div class="bg-white border border-gray-100 shadow-sm text-gray-800 rounded-2xl rounded-tl-sm px-5 py-3.5 text-[15px] leading-relaxed break-words bot-message-content">
                            ${formatText(text)}
                        </div>
                    </div>
                `;
            } else if (role === 'typing') {
                msgWrapper.id = 'typing-indicator';
                innerHTML = `
                    <div class="flex max-w-[85%] sm:max-w-[75%]">
                         <div class="w-8 h-8 flex-shrink-0 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-full flex items-center justify-center mt-1 mr-2 hidden sm:flex">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <div class="bg-white border border-gray-100 shadow-sm rounded-2xl rounded-tl-sm px-5 py-4 flex items-center">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                    </div>
                `;
            }

            msgWrapper.innerHTML = innerHTML;
            chatContainer.appendChild(msgWrapper);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearChat() {
            // Keep only the welcome message (first child)
            while (chatContainer.children.length > 1) {
                chatContainer.removeChild(chatContainer.lastChild);
            }
        }

        // Basic HTML escaping to prevent XSS in user input
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Convert basic markdown (like bolding and line breaks) to HTML for bot responses
        function formatText(text) {
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || isWaitingForResponse) return;

            // 1. Add user message
            appendMessage('user', text);
            messageInput.value = '';
            messageInput.style.height = '44px';
            isWaitingForResponse = true;

            // 2. Show typing indicator
            appendMessage('typing');

            // 3. API Call Logic
            try {
                // Ensure we are pointing to the correct local API
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    // Send the message AND the unique session ID
                    body: JSON.stringify({ 
                        message: text,
                        session_id: sessionId
                    }) 
                });

                if (!response.ok) {
                    throw new Error(`Server responded with status: ${response.status}`);
                }

                const data = await response.json();
                
                removeTypingIndicator();
                appendMessage('bot', data.reply || data.response || "I received empty data from the server.");

            } catch (error) {
                console.warn("Local API unreachable. Triggering fallback simulated response.", error);
                
                // Fallback Simulation Logic (if backend is offline or crashes)
                setTimeout(() => {
                    removeTypingIndicator();
                    
                    let fakeResponse = "";
                    const lowerText = text.toLowerCase();
                    
                    if (lowerText.includes('policy') || lowerText.includes('document') || lowerText.includes('rag')) {
                        fakeResponse = "**(Simulated Internal DB Search)** \nBased on the loaded PDFs, our internal policy states that all data must remain confidential. *(Note: Local server is offline, this is a simulated fallback).*";
                    } else if (lowerText.includes('weather') || lowerText.includes('news') || lowerText.includes('who is')) {
                        fakeResponse = "**(Simulated Live Web Search)** \nI've searched the internet. Currently, it looks like conditions are clear. *(Note: Local server is offline, this is a simulated fallback).*";
                    } else {
                        fakeResponse = `I received your message: "${text}". \n\n*Note: My connection to the local API failed. Please ensure your Python backend is running. This is a simulated fallback response.*`;
                    }
                    
                    appendMessage('bot', fakeResponse);
                    isWaitingForResponse = false;
                }, 1500);
                return; 
            }
            
            isWaitingForResponse = false;
        });
    </script>
</body>
</html>
